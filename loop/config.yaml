# Edit only this file; prepare derives native CHIA YAML for each experiment.
# Local Chipyard input tree; copied once with relevant uncommitted files.
source: ..
# Experiment/seed directory, relative to this configuration.
storage: ./experiments
# Loop-local Python executable created by bootstrap.py.
python: ./.venv/bin/python
# Pinned CHIA checkout installed by bootstrap.py.
chia: ./.deps/chia
# SkyDiscover package inside the evolve-flows submodule.
skydiscover: ./.deps/evolve-flows/skydiscover
# Pinned evolve-flows checkout used to provide SkyDiscover.
evolve_flows: ./.deps/evolve-flows
# Repositories and exact revisions installed by bootstrap.py.
dependencies:
  # Upstream evolve-flows repository to clone.
  evolve_flows_url: https://github.com/ucb-bar/evolve-flows.git
  # Exact evolve-flows commit, including its SkyDiscover gitlink.
  evolve_flows_revision: 62d271304d4675c21b946e327bf542a1f62c1012
  # Upstream CHIA repository to clone.
  chia_url: https://github.com/ucb-bar/chia.git
  # Exact CHIA commit; no local compatibility patches are applied.
  chia_revision: a4cedf24b131c459d7f176453d8e0cea97dda796
# CHIA connection and service limits; worker deployment is below.
runtime:
  # Activated local toolchain directory, mounted read-only in workers.
  conda: ../.conda-env
  # Existing native CHIA head address; match the head/worker command port.
  ray_address: 127.0.0.1:6387
  # Build/run collection deadline per phase, in seconds.
  task_timeout_seconds: 14400
  # CHIA task-output cache capacity, in GB.
  cache_gb: 4
# CLI generation settings; model/backend may change between resumes.
agent:
  # Selected CLI provider: antigravity, claude, or codex; redeploy workers after switching.
  backend: antigravity
  # Provider model override; null uses the CHIA wrapper default.
  model: null
  # Wall-clock timeout for one CLI call, in seconds.
  timeout_seconds: 600
  # Maximum CLI attempts made by the native CHIA wrapper.
  retries: 1
  # Run a real BashTool/checksum probe before new LLM work.
  authenticate_before_run: true
  # Provider-specific images, private credentials, and native CLI options.
  backends:
    # Google Antigravity worker and optional private-copy overrides.
    antigravity:
      # Host login directory to copy read-only into the worker private home.
      credentials: ${HOME}/.gemini
      # Private credential-copy path inside the generation container.
      credential_target: /tmp/agent-home/.gemini
      # Optional project override; null preserves the copied Antigravity setting.
      gcp_project: null
      # Optional location override; null preserves the copied Antigravity setting.
      gcp_location: null
      # Keyword arguments passed to this native CHIA CLI model class.
      options:
        # Additional CLI arguments, one token per list item.
        extra_cli_args:
        - --effort
        - low
      # Provider-specific native Docker options; keep credential/binary mounts read-only.
      mounts: []
      # Immutable upstream image digest; change only when preparing compatible new workers.
      image: ghcr.io/ucb-bar/chia-antigravity@sha256:e4a1dfdcc9fea188667178311d47a2da7ac8dd150877f74748fce24b39329a0f
    # Claude Code worker; its native tools are disabled in favor of BashTool.
    claude:
      # Host login directory to copy read-only into the worker private home.
      credentials: ${HOME}/.claude
      # Private credential-copy path inside the generation container.
      credential_target: /tmp/agent-home/.claude
      # Keyword arguments passed to this native CHIA CLI model class.
      options:
        # Claude transcript lookup override; null uses the private working directory.
        projects_cwd: null
        # Additional CLI arguments, one token per list item.
        extra_cli_args:
        - --tools
        - ''
        - --strict-mcp-config
      # Provider-specific native Docker options; keep credential/binary mounts read-only.
      mounts:
      # Read-only dependency, code, credential, or toolchain bind.
      - --mount 'type=bind,src=${HOME}/.claude.json,dst=/credential-config,readonly'
      # Provider setup commands run in the container private home.
      setup_commands:
      - cp /credential-config /tmp/agent-home/.claude.json
      # Immutable upstream image digest; change only when preparing compatible new workers.
      image: ghcr.io/ucb-bar/chia-claude-code@sha256:00e0817ddf405d0d6a79100ba81b76fa06050a6b84a0950cae534a83a54b74fe
    # Codex on the upstream CHIA base image with host CLI binaries mounted read-only.
    codex:
      # Host login directory to copy read-only into the worker private home.
      credentials: ${HOME}/.codex
      # Private credential-copy path inside the generation container.
      credential_target: /tmp/agent-home/.codex
      # Keyword arguments passed to this native CHIA CLI model class.
      options: {}
      # Provider-specific native Docker options; keep credential/binary mounts read-only.
      mounts:
      # Read-only dependency, code, credential, or toolchain bind.
      - --mount 'type=bind,src=${HOME}/.local/bin/codex,dst=/usr/local/bin/codex,readonly'
      # Read-only dependency, code, credential, or toolchain bind.
      - --mount 'type=bind,src=${HOME}/.codex/packages/standalone/current/bin/codex-code-mode-host,dst=/usr/local/bin/codex-code-mode-host,readonly'
      # Immutable upstream image digest; change only when preparing compatible new workers.
      image: ghcr.io/ucb-bar/chia@sha256:8196c9c1f2790989f06383f2455c888cd7472bd6237cbb7256a080d4c5977b11
# Native SkyDiscover openevolve_native settings.
search:
  # Total search proposals requested across this experiment and resumes.
  iterations: 2
  # Random seed for native search sampling.
  random_seed: 42
  # Number of additional programs sampled for generation context.
  inspirations: 3
  # Number of native search islands; at least two.
  num_islands: 2
  # Native population capacity, in programs.
  population_size: 40
  # Native elite archive capacity, in programs.
  archive_size: 100
  # Measured descriptors used by native MAP-Elites.
  feature_dimensions:
  - source_bytes
  - dma_bytes_per_cycle
  # Number of bins per native MAP-Elites descriptor.
  feature_bins: 8
  # Fraction of native sampling allocated to exploration (0–1).
  exploration_ratio: 0.2
  # Fraction of native sampling allocated to exploitation (0–1).
  exploitation_ratio: 0.7
  # Probability of choosing native archive elites (0–1).
  elite_selection_ratio: 0.1
  # Native island generations between migration attempts.
  migration_interval: 2
  # Fraction of native island programs migrated per event (0–1).
  migration_rate: 0.1
  # DMA-specific prompts, indexed by selected island.
  island_guidance:
  - Reduce small-copy latency and setup overhead.
  - Increase large-copy throughput and overlap accelerator-local requests.
  # Maximum concurrent candidate iterations in DiscoveryController.
  max_in_flight: 2
  # Search implementation; keep openevolve_native for native checkpoint ownership.
  type: openevolve_native
# DMA SoC compilation inputs; simulator assertions remain enabled.
hardware:
  # Chipyard SoC configuration class to elaborate.
  config: DMARocketConfig
  # Scala package containing the SoC configuration class.
  config_package: chipyard
  # Fixed writable accelerator paths; expanding this requires a new integration.
  allowlist:
  - generators/chipyard/src/main/scala/dma/DMAController.scala
  - generators/chipyard/src/main/scala/dma/RoCCDMA.scala
  # Parallel compiler jobs for one simulator build.
  make_jobs: 8
  # Simulator compilation timeout, in seconds.
  build_timeout_seconds: 3600
  # Extra variables passed to the upstream Chipyard make flow.
  extra_make_args:
    # Use the upstream image compiler; local Verilator otherwise embeds a host compiler/sysroot path.
    CXX: /home/ray/chipyard/.conda-env/bin/x86_64-conda-linux-gnu-c++
    # Maximum Java build heap, in GiB.
    JAVA_HEAP_SIZE: 8G
  # Whether ChiselBuildNode cleans generated build outputs before compilation.
  clean: false
# Embench inputs and DMA metrics parser, frozen with the seed.
software:
  # Existing DMA parser path relative to the preserved source tree.
  metrics_parser: software/rocc-dma/scripts/metrics.py
  # Commands producing frozen benchmark ELFs in the private build checkout.
  build_commands:
  - - python
    - software/rocc-dma/scripts/embench.py
    - build
    - --modes
    - cpu
    - dma
  # Directory whose subdirectories name the Embench workloads.
  benchmark_inventory: tests/embench-iot/src
  # ELF path pattern relative to the build checkout.
  embench_elf: software/rocc-dma/build/embench-{mode}/src/{benchmark}/{benchmark}
  # Frozen DRAMSim configuration directory relative to the seed tree.
  dram_ini: generators/testchipip/src/main/resources/dramsim2_ini
  # Random seed passed to each simulator task.
  random_seed: 42
  # Simulator plusargs; each task supplies its own ELF loadmem path.
  plusargs:
    # Request measured simulator cycle counts.
    +cycle-count: ''
    # Task-overridden ELF load path; the simulator stages each benchmark independently.
    +loadmem: /test.elf
  # Maximum simulated cycles before the simulator reports timeout.
  timeout_cycles: 1000000000
  # Wall-clock timeout for each simulator task, in seconds.
  timeout_seconds: 10800
# DMA-specific validation and geometric-mean score policy.
fitness:
  # Optional nonnegative weights keyed by Embench DMA workload name.
  workload_weights: {}
  # Reject changes in measured DMA work relative to the frozen reference.
  require_activity_match: true
  # Optional area gate in the estimator units; null disables it.
  max_area: null
  # Optional delay gate in the estimator units; null disables it.
  max_delay: null
# Enable CHIA output caching for the listed expensive tasks.
cache:
  # Cache compiled simulator artifacts through CHIA get callbacks.
  build: true
  # Enable native simulator task caching/bypass.
  simulate: true
# Enable native CHIA reuse providers; completed proposals always remain durable in SQL.
bypass:
  # Enable SQL-based completed-proposal bypass, independent of cache eviction.
  generate: true
  # Reuse completed simulator builds from the native CHIA cache.
  build: true
  # Enable native simulator task caching/bypass.
  simulate: true
# Seed-copy exclusions; do not exclude implementation or evaluation inputs.
preserve:
  # Directory basenames excluded from the one-time seed copy.
  exclude_dirs:
  - .git
  - loop
  - loop_context
  - .conda-env
  - .venv
  - __pycache__
  - .pytest_cache
  - target
  # Source-relative generated/irrelevant paths excluded from the seed copy.
  exclude_paths:
  - software/rocc-dma/build
  - sims/verilator/generated-src
  - sims/verilator/output
  - sims/firesim/platforms/f1/aws-fpga/SDAccel/examples
  - software/firemarshal/boards/default/linux
# Native CHIA YAML template; prepare expands run paths and generation worker indices.
cluster:
  # Native cluster identity, expanded with the experiment name.
  cluster_name: dma-${NAME}
  # Native CHIA head placement.
  provider:
    # SSH-reachable host for the head; use the same host as local workers here.
    head_ip: 127.0.0.1
  # Native SSH authentication; configure the existing host login/key.
  auth:
    # Existing worker-host SSH user.
    ssh_user: ${USER}
    # Existing SSH private key path; bootstrap never edits authorized_keys.
    ssh_private_key: ${HOME}/.ssh/id_ed25519
  # Host toolchain/import environment for native head startup and teardown.
  head_env_commands:
  # Executable lookup order: mounted toolchain, provider binaries, then system tools.
  - export PATH=${VENV}/bin:${CONDA}/bin:${CONDA}/riscv-tools/bin:/usr/local/bin:/usr/bin:/bin
  # Read-only CHIA/tutorial/SkyDiscover package import paths.
  - export PYTHONPATH=${LOOP}:${CHIA}:${EVOLVE}:${SKY}
  # Native head startup; address/dashboard ports must be free and consistent.
  head_start_ray_commands:
  - ${VENV}/bin/python ${CONDA}/bin/ray start --head --node-ip-address=127.0.0.1 --port=6387 --num-cpus=4 --dashboard-host=127.0.0.1
    --dashboard-port=8287 --temp-dir=/tmp/ray/dma-${NAME}
  # Native worker startup using the per-pool CHIA_CPUS environment.
  worker_start_ray_commands:
  - ${VENV}/bin/python ${CONDA}/bin/ray start --address=$RAY_HEAD_IP:6387 --num-cpus=$CHIA_CPUS --dashboard-agent-listen-port=0
  # Native build, simulation, and generation worker templates.
  available_node_types:
    # Private simulator-build workers; increase container count for parallel builds.
    build:
      # Custom Ray scheduling slots advertised by each native worker.
      resources:
        # One build slot per private writable checkout; keep this value at one.
        chipyard: 1
      # Build container count; each container has its own writable checkout.
      num_workers: 1
      # SSH worker hosts; this example places all pools on the head host.
      compatible_ips:
      - 127.0.0.1
      # Environment for setup and Ray tasks, including CPU and private-home settings.
      worker_env_commands:
      # Executable lookup order: mounted toolchain, provider binaries, then system tools.
      - export PATH=${VENV}/bin:${CONDA}/bin:/home/ray/chipyard/.conda-env/riscv-tools/bin:/usr/local/bin:/usr/bin:/bin
      # Read-only CHIA/tutorial/SkyDiscover package import paths.
      - export PYTHONPATH=/opt/loop:/opt/chia:/opt/skydiscover
      # Ray CPU budget for this worker, in logical CPUs.
      - export CHIA_CPUS=24
      # Native setup commands; project writes stay in the private worker checkout.
      worker_setup_commands:
      - mkdir -p /home/ray/dma-build
      - cp -a ${SEED}/tree/. /home/ray/dma-build/
      - chmod -R u+w /home/ray/dma-build
      # Native Docker worker configuration; CHIA supplies ordinary host networking.
      docker:
        # Immutable upstream image digest; change only when preparing compatible new workers.
        image: ghcr.io/ucb-bar/chia-chisel-build@sha256:9eca4dffdce51835005d5971864306d84fe46cc2dd2feb440521b98a14d84300
        # Run-specific container prefix; CHIA appends its native worker index.
        container_name: dma-${NAME}-build
        # Let native chia up fetch the pinned upstream image.
        pull_before_run: true
        # Native Docker flags and mounts; generation has only two writable project binds.
        run_options:
        # Container shared-memory capacity, in bytes with Docker size suffix.
        - --shm-size=2g
        # Per-process soft/hard open-file descriptor limits.
        - --ulimit nofile=65536:65536
        # Upstream build-image RISC-V toolchain and runtime-library prefix.
        - --env RISCV=/home/ray/chipyard/.conda-env/riscv-tools
        # JVM CPU count, heap/stack sizes, and private temporary/home directories.
        - --env 'JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=8 -Xmx8G -Xss8M -Djava.io.tmpdir=/tmp
          -Duser.home=/home/ray'
        # Dependency-cache path inside the private build checkout.
        - --env COURSIER_CACHE=/home/ray/dma-build/.coursier/cache
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CONDA},dst=${CONDA},readonly'
        # Pinned loop Python packages, mounted read-only to match the head environment.
        - --mount 'type=bind,src=${VENV},dst=${VENV},readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${LOOP}/chia_dma,dst=/opt/loop/chia_dma,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CHIA},dst=/opt/chia,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${SKY},dst=/opt/skydiscover,readonly'
        # Trusted evaluator output directory; never mounted writable in generation.
        - --mount 'type=bind,src=${RUN},dst=${RUN}'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${SEED},dst=${SEED},readonly'
        # Maximum image pull time, in seconds (the build image is large).
        pull_timeout: 7200
    # Simulation worker pool for independent benchmark tasks.
    simulation:
      # Custom Ray scheduling slots advertised by each native worker.
      resources:
        # Concurrent benchmark tasks allowed per simulation worker.
        verilator_run: 24
      # Simulation container count; each advertises the resource slots above.
      num_workers: 1
      # SSH worker hosts; this example places all pools on the head host.
      compatible_ips:
      - 127.0.0.1
      # Environment for setup and Ray tasks, including CPU and private-home settings.
      worker_env_commands:
      # Executable lookup order: mounted toolchain, provider binaries, then system tools.
      - export PATH=${VENV}/bin:/usr/local/bin:${CONDA}/bin:/usr/bin:/bin
      # Read-only CHIA/tutorial/SkyDiscover package import paths.
      - export PYTHONPATH=/opt/loop:/opt/chia:/opt/skydiscover
      # Ray CPU budget for this worker, in logical CPUs.
      - export CHIA_CPUS=24
      # Native Docker worker configuration; CHIA supplies ordinary host networking.
      docker:
        # Immutable upstream image digest; change only when preparing compatible new workers.
        image: ghcr.io/ucb-bar/chia-verilator-run@sha256:188e6ce07df32b8acaefede77fd4691e44da889a318527bf9eff047bb4c655c1
        # Run-specific container prefix; CHIA appends its native worker index.
        container_name: dma-${NAME}-simulation
        # Let native chia up fetch the pinned upstream image.
        pull_before_run: true
        # Native Docker flags and mounts; generation has only two writable project binds.
        run_options:
        # Container shared-memory capacity, in bytes with Docker size suffix.
        - --shm-size=2g
        # Per-process soft/hard open-file descriptor limits.
        - --ulimit nofile=65536:65536
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CONDA},dst=${CONDA},readonly'
        # Pinned loop Python packages, mounted read-only to match the head environment.
        - --mount 'type=bind,src=${VENV},dst=${VENV},readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${LOOP}/chia_dma,dst=/opt/loop/chia_dma,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CHIA},dst=/opt/chia,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${SKY},dst=/opt/skydiscover,readonly'
        # Trusted evaluator output directory; never mounted writable in generation.
        - --mount 'type=bind,src=${RUN},dst=${RUN}'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${SEED},dst=${SEED},readonly'
        # Maximum image pull time, in seconds (the build image is large).
        pull_timeout: 7200
    # Generation pool here; one slot per worker serializes workspace reuse.
    generation:
      # Custom Ray scheduling slots advertised by each native worker.
      resources:
        # Generation pool here; one slot per worker serializes workspace reuse.
        generation: 1
      # Container count; generation expands to a distinct workspace per container.
      num_workers: 2
      # SSH worker hosts; this example places all pools on the head host.
      compatible_ips:
      - 127.0.0.1
      # Environment for setup and Ray tasks, including CPU and private-home settings.
      worker_env_commands:
      # Executable lookup order: mounted toolchain, provider binaries, then system tools.
      - export PATH=${VENV}/bin:${CONDA}/bin:${CONDA}/riscv-tools/bin:/home/ray/.local/bin:/usr/local/bin:/usr/bin:/bin
      # Read-only CHIA/tutorial/SkyDiscover package import paths.
      - export PYTHONPATH=/opt/loop:/opt/chia:/opt/skydiscover
      # Ray CPU budget for this worker, in logical CPUs.
      - export CHIA_CPUS=2
      # Writable private CLI home in tmpfs; image tools remain read-only.
      - export HOME=/tmp/agent-home
      # Native setup commands; project writes stay in the private worker checkout.
      worker_setup_commands:
      - mkdir -p ${CREDENTIAL_TARGET}
      - rsync -a --exclude conversations --exclude sessions --exclude projects --exclude
        logs --exclude "*.log" --exclude tmp --exclude history.jsonl --exclude shell_snapshots
        --exclude "*.sock" --exclude app-server-control --exclude app-server-daemon
        /credentials/ ${CREDENTIAL_TARGET}/
      # Native Docker worker configuration; CHIA supplies ordinary host networking.
      docker:
        # Immutable upstream image digest; change only when preparing compatible new workers.
        image: ${AGENT_IMAGE}
        # Run-specific container prefix; CHIA appends its native worker index.
        container_name: dma-${NAME}-generation-${INDEX}
        # Let native chia up fetch the pinned upstream image.
        pull_before_run: true
        # Maximum image pull time, in seconds (the build image is large).
        pull_timeout: 7200
        # Native Docker flags and mounts; generation has only two writable project binds.
        run_options:
        # Container shared-memory capacity, in bytes with Docker size suffix.
        - --shm-size=256m
        # Make the generation container root filesystem read-only.
        - --read-only
        # Drop Linux capabilities from trusted generation processes.
        - --cap-drop=ALL
        # Prevent privilege gains inside generation workers.
        - --security-opt=no-new-privileges
        # Private writable temporary storage for Ray, credentials, and CLI scratch files.
        - --tmpfs /tmp:rw,exec,mode=1777
        # Run generation as the host UID/GID owning its two writable files.
        - --user ${UID}:${GID}
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CONDA},dst=${CONDA},readonly'
        # Pinned loop Python packages, mounted read-only to match the head environment.
        - --mount 'type=bind,src=${VENV},dst=${VENV},readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${LOOP}/chia_dma,dst=/opt/loop/chia_dma,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${CHIA},dst=/opt/chia,readonly'
        # Read-only dependency, code, credential, or toolchain bind.
        - --mount 'type=bind,src=${SKY},dst=/opt/skydiscover,readonly'
        # Preserved project input mounted read-only.
        - --mount 'type=bind,src=${SEED}/tree,dst=/workspace,readonly'
        # Writable bind for this worker's selected-parent accelerator file.
        - --mount 'type=bind,src=${WORK}/DMAController.scala,dst=/workspace/generators/chipyard/src/main/scala/dma/DMAController.scala'
        # Writable bind for this worker's selected-parent accelerator file.
        - --mount 'type=bind,src=${WORK}/RoCCDMA.scala,dst=/workspace/generators/chipyard/src/main/scala/dma/RoCCDMA.scala'
        # Host provider login mounted read-only before copying to the private home.
        - --mount 'type=bind,src=${CREDENTIALS},dst=/credentials,readonly'
